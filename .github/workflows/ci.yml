name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  lighthouse:
    name: Lighthouse CI (home, case study, 404; mobile and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # No secrets: the site builds and the three pages render without OPENAI_API_KEY or DATABASE_URL.
      - name: Lighthouse mobile (median of 3)
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.mobile.cjs
      - name: Lighthouse desktop (median of 3)
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.desktop.cjs
      - name: Print the median scores
        if: always()
        run: |
          node -e '
            const fs=require("fs");
            for (const p of ["mobile","desktop"]) {
              const d=`lhci/out-${p}`; if(!fs.existsSync(d)) continue;
              const by={};
              for (const f of fs.readdirSync(d).filter(f=>/\.report\.json$/.test(f))) {
                const r=JSON.parse(fs.readFileSync(`${d}/${f}`));
                const u=new URL(r.finalUrl||r.requestedUrl).pathname;
                (by[u]??=[]).push(Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,Math.round(v.score*100)])));
              }
              for (const [u,runs] of Object.entries(by)) console.log(p.padEnd(8),u.padEnd(34),JSON.stringify(runs));
            }'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lhci/out-*/
          retention-days: 14
